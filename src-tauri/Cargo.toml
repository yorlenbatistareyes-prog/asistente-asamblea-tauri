[package]
name = "rassembly"
version = "1.0.3"
description = "RAssembly - Gestión de Asambleas Regionales"
authors = ["Yorlen Batista"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rassembly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-opener = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

aes-gcm = "0.10" # Para la encriptación segura
pbkdf2 = "0.12"  # Para convertir tu contraseña en una llave fuerte
sha2 = "0.10"
rand = "0.8"

# Esta es la base de datos:
rusqlite = { version = "0.32.0", features = ["bundled"] }
chrono = "0.4" 
# Esto es para leer los CSV de JW Hub:
csv = "1.3"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
tauri-plugin-http = "2"

